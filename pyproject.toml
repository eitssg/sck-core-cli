[project]
name = "sck-core-cli"
version = "1.3.0"
description = "Core Automation Deployment Engine Tools, SCK Module, and CLI"
authors = [{name="James Barwick", email="jbarwick@eits.com.sg"}]
license = "GPL-3.0-only"
readme = "README.md"
maintainers = [{name="James Barwick", email="jbarwick@eits.com.sg"}]
keywords = ["sck", "core", "aws", "cloud", "automation"]
requires-python=">=3.11,<3.13"

dependencies= [
   "requests (>=2.32.3)",
   "boto3 (>=1.34.51,<1.35.0)",
   "botocore (>=1.34.51,<1.35.0)",
   "cfnresponse (>=1.1.4)",
   "cryptography (>=45.0.0)",
   "argcomplete (>=3.3.0)",
   "jmespath (>=1.0.1)",
   "python-dateutil (>=2.9.0.post0)",
   "s3transfer (>=0.10.1)",
   "six (>=1.16.0)",
   "urllib3 (>=2.2.3)",
   "xmltodict (>=0.13.0)",
   "yq (>=3.4.3)",
   "rich (>=13.9.4)",
   "httpx (>=0.28.1)",
   "sck-core-framework",
   "sck-core-db",
   "sck-core-component",
   "sck-core-deployspec",
   "sck-core-invoker",
   "sck-core-runner",
   "sck-core-execute",
   "sck-core-organization",
   "sck-core-report",
]

[project.optional-dependencies]
dev = [
   "pytest>=8.3.3",
   "flake8>=7.1.1",
   "cfn-lint>=1.22",
   "pytest-asyncio>=0.25.0",
   "boto3-stubs>=1.34.51",
   "pytest-dotenv>=0.5.2",
   "pytest-cov>=6.0.0",
   "black>=24.10.0",
   "fastapi (>=0.115.4)",
   "uvicorn>=0.34.0",
]

[tool.hatch.build.targets.wheel]
packages = ["core_cli"]

[tool.black]
line-length = 132
target-version = ["py311"]
skip-string-normalization = true

# Use a proper multi-line regex (mirrors style used in framework module)
exclude = '''
/(
        \.git
    | \.mypy_cache
    | \.pytest_cache
    | build
    | dist
    | venv
    | \.venv
    | htmlcov
)/
'''

[tool.uv.sources]
sck-core-framework = { path = "../sck-core-framework", editable = true }
sck-core-db = { path = "../sck-core-db", editable = true }
sck-core-component = { path = "../sck-core-component", editable = true }
sck-core-deployspec = { path = "../sck-core-deployspec", editable = true }
sck-core-invoker = { path = "../sck-core-invoker", editable = true }
sck-core-runner = { path = "../sck-core-runner", editable = true }
sck-core-execute = { path = "../sck-core-execute", editable = true }
sck-core-organization = { path = "../sck-core-organization", editable = true }
sck-core-report = { path = "../sck-core-report", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

